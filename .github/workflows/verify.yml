name: PR Verification & CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

  backend-verify:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: kapila_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/kapila_test
          NODE_ENV: test
        run: npm run migrate

      - name: Execute Backend Test Suite
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/kapila_test
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_kapila_enterprise
          KAFKAJS_NO_PARTITIONER_WARNING: 1
        run: npm test

  coderabbit-gate:
    name: CodeRabbit Config & Quality Guard
    runs-on: ubuntu-latest
    needs: [frontend-verify, backend-verify]
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate CodeRabbit Configuration
        run: |
          if [ -f .coderabbit.yaml ]; then
            echo "CodeRabbit configuration (.coderabbit.yaml) verified successfully."
          else
            echo "Error: .coderabbit.yaml is missing from repository root."
            exit 1
          fi

      - name: Check Upstream Job Statuses
        run: |
          if [ "${{ needs.frontend-verify.result }}" != "success" ] || [ "${{ needs.backend-verify.result }}" != "success" ]; then
            echo "Upstream verification failed. PR check failing."
            exit 1
          fi
          echo "All verification gates passed. Ready for automated CodeRabbit assertiveness review."
